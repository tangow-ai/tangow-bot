appId: com.romainjeff.tangow
name: Tangow mobile screenshots
tags:
  - screenshots
---
- launchApp:
    clearState: true
    permissions:
      notifications: deny

# A cold API 34 emulator can show a launcher ANR over the healthy app.
- extendedWaitUntil:
    visible: "Sign up for Tangow|Pixel Launcher isn't responding"
    timeout: 30000
- runFlow:
    when:
      visible: "Pixel Launcher isn't responding"
    commands:
      - tapOn: "Close app"
- extendedWaitUntil:
    visible: "Sign up for Tangow"
    timeout: 30000
- takeScreenshot: "02-sign-up"
- tapOn: "Sign in"
- assertVisible: "Sign in to Tangow"
- takeScreenshot: "01-sign-in"

- tapOn: "Use a custom server"
- assertVisible: "Server"
- takeScreenshot: "03-server"
- tapOn: "Cancel"

- tapOn: "Email"
- inputText: ${TANGOW_SCREENSHOT_EMAIL}
- tapOn: "Password"
- inputText: ${TANGOW_SCREENSHOT_PASSWORD}
- hideKeyboard
- tapOn: "Sign in"
- tapOn:
    text: "Don’t allow"
    optional: true
# iOS can drop that alert before the tap, which then opens an inbox row; start from the inbox.
- runFlow:
    when:
      platform: iOS
    commands:
      - runFlow:
          file: subflows/open-link.yaml
          env:
            LINK: "tangow:///"
- extendedWaitUntil:
    visible: "Researcher.*"
    timeout: 30000
- takeScreenshot: "04-inbox"

- tapOn: "Activity"
- extendedWaitUntil:
    visible: "Recent"
    timeout: 10000
- takeScreenshot: "05-activity"

- tapOn: "Search"
- inputText: "fixture"
# iOS hides the keyboard with a tap that can land on a result; submitting closes it instead.
- runFlow:
    when:
      platform: iOS
    commands:
      - pressKey: Enter
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- extendedWaitUntil:
    visible: "Weekly fixture review(, .*)?"
    timeout: 10000
- takeScreenshot: "06-search-results"

- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "tangow:///new"
- assertVisible: "Name this bot"
- takeScreenshot: "07-new-bot"

- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "tangow:///new-group"
- assertVisible: "Name this group"
- takeScreenshot: "08-new-group"

- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "tangow:///new-space"
- assertVisible: "Customer support"
- takeScreenshot: "09-new-space"

- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "tangow:///account"
- extendedWaitUntil:
    visible: "Integrations(, .*)?"
    timeout: 10000
- takeScreenshot: "10-settings"
- tapOn: "Usage(, .*)?"
- extendedWaitUntil:
    visible: "Model spend uses your provider keys."
    timeout: 10000
- takeScreenshot: "10d-usage"
- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "tangow:///account"

- tapOn: "Computer(, .*)?"
- extendedWaitUntil:
    visible: "Update all computers|No computers|(Private|Team) Computer"
    timeout: 10000
- takeScreenshot: "10c-computer-settings"
- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "tangow:///account"

- tapOn: ".*${TANGOW_SCREENSHOT_EMAIL}.*"
- extendedWaitUntil:
    visible: "Change password(, .*)?"
    timeout: 10000
- takeScreenshot: "10e-profile"
- tapOn: "Change password(, .*)?"
- assertVisible: "Current password"
- takeScreenshot: "10b-change-password"

- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "tangow:///models"
- extendedWaitUntil:
    visible: "Active model"
    timeout: 10000
- tapOn: "Active model"
- tapOn: "Auto"
- assertVisible: "Fast"
- assertVisible: "Everyday"
- assertVisible: "Complex"
- takeScreenshot: "11-auto-models"
- tapOn: "Active model"
- tapOn: "Scripted.*"
- takeScreenshot: "11-models"

- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "tangow:///account"
- tapOn: "Providers(, .*)?"
- extendedWaitUntil:
    visible: "Models"
    timeout: 10000
- takeScreenshot: "11c-providers"
- scrollUntilVisible:
    element: "Show more"
    direction: DOWN
- tapOn: "Show more"
- scrollUntilVisible:
    element: "Show less"
    direction: DOWN
    # Each swipe takes about four seconds; the full list needs more than the default 20.
    timeout: 40000
- takeScreenshot: "11b-all-providers"

- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "tangow:///voice"
- extendedWaitUntil:
    visible: "Connect a voice provider"
    timeout: 10000
- takeScreenshot: "12-voice"

- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "tangow:///integrations"
- extendedWaitUntil:
    visible: "Search apps"
    timeout: 10000
- takeScreenshot: "13-integrations"

- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "tangow:///custom-apps"
- extendedWaitUntil:
    visible: "App URL"
    timeout: 10000
- takeScreenshot: "14-custom-apps"

- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "tangow:///skills"
- extendedWaitUntil:
    visible: "New skill"
    timeout: 10000
- takeScreenshot: "14b-skills"
# Bundled skills come first.
- scrollUntilVisible:
    element: "team-review(, .*)?"
    direction: DOWN
- tapOn: "team-review(, .*)?"
- assertVisible: "Review shared work before publishing."
- assertVisible: "Content lives on the shared volume."
- takeScreenshot: "14c-shared-skill"

- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "tangow:///thread?botId=${TANGOW_SCREENSHOT_BOT_ID}&name=Researcher"
# The image stacks seeded after it push the exchange above the fold.
- scrollUntilVisible:
    element: "The fixture workspace is ready."
    direction: UP
    timeout: 20000
    # Off center it can stop under the header, where a long press opens the bot's menu.
    centerElement: true
- assertNotVisible: "(.*, )?Reply"
- assertNotVisible: "(.*, )?Select text"
- takeScreenshot: "15-thread"
- longPressOn: "The fixture workspace is ready."
- assertVisible: "(.*, )?Reply"
- assertVisible: "(.*, )?Speak message"
- assertVisible: "(.*, )?Copy"
- assertVisible: "(.*, )?Select text"
- takeScreenshot: "15b-message-actions"
- tapOn: "(.*, )?Select text"
- assertNotVisible: "(.*, )?Reply"
- takeScreenshot: "15d-message-select-text"
- back
# User messages have no Speak.
- scrollUntilVisible:
    element: "Summarize the fixture launch checklist."
    direction: UP
- longPressOn: "Summarize the fixture launch checklist."
- assertVisible: "(.*, )?Reply"
- assertVisible: "(.*, )?Copy"
- assertNotVisible: "(.*, )?Speak message"
- tapOn: "(.*, )?Reply"
- assertVisible: "Replying to"
- tapOn: "Cancel reply"
# A routine's result acts as a bot message.
- scrollUntilVisible:
    element: "Two open questions remain on the fixture launch."
    direction: DOWN
- longPressOn: "Two open questions remain on the fixture launch."
- assertVisible: "(.*, )?Reply"
- assertVisible: "(.*, )?Copy"
- takeScreenshot: "15e-routine-actions"
- tapOn: "(.*, )?Reply"
- assertVisible: "Replying to"
- takeScreenshot: "15f-routine-reply"
- tapOn: "Cancel reply"
# Bot actions live on a long press of the header title (its accessible name
# is the bot's name; a short press opens the bot's page).
- longPressOn: "Researcher"
- assertVisible: "Clear conversation"
- takeScreenshot: "16-bot-actions"
# iOS menus close on a tap outside; Android's list closes on back.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: "50%,92%"
- runFlow:
    when:
      platform: Android
    commands:
      - back

- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "tangow:///bot?botId=${TANGOW_SCREENSHOT_BOT_ID}&tab=settings"
- extendedWaitUntil:
    visible: "Instructions(, .*)?"
    timeout: 10000
- assertVisible: "Voice and replies(, .*)?"
- assertVisible: "Model(, .*)?"
- assertVisible: "(.*, )?Space default.*"
- takeScreenshot: "17-bot-settings"
- tapOn: "Appearance"
- extendedWaitUntil:
    visible: "Floppy"
    timeout: 10000
- takeScreenshot: "17b-bot-appearance"

- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "tangow:///computer?botId=${TANGOW_SCREENSHOT_BOT_ID}&name=Researcher"
- extendedWaitUntil:
    visible: "Take control"
    timeout: 10000
- takeScreenshot: "18-computer"

- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "tangow:///group-thread?groupId=${TANGOW_SCREENSHOT_GROUP_ID}&name=Launch%20team"
- extendedWaitUntil:
    visible: "Launch checklist"
    timeout: 10000
- assertNotVisible: "(.*, )?Reply"
- takeScreenshot: "19-group-thread"
- longPressOn: "Here.s a tighter quote for the release."
- assertVisible: "(.*, )?Reply"
- assertVisible: "(.*, )?Select text"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: "dismiss popup"
- runFlow:
    when:
      platform: Android
    commands:
      - back
- tapOn: "Open in full screen"
- takeScreenshot: "19b-widget-full-screen"
- tapOn: "Close preview"
# The teammate's message sits under her name, before the user's own exchange.
- scrollUntilVisible:
    element: "I'll take the press quote."
    direction: UP
- assertVisible: "Grace Hopper"
- takeScreenshot: "19c-group-thread-people"

- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "tangow:///group-settings?groupId=${TANGOW_SCREENSHOT_GROUP_ID}"
- extendedWaitUntil:
    visible: "Lead bot"
    timeout: 10000
- assertVisible: "Grace Hopper"
- takeScreenshot: "20-group-settings"
- scrollUntilVisible:
    element: "Delete group"
    direction: DOWN

- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "tangow:///bot-routine?botId=${TANGOW_SCREENSHOT_BOT_ID}&routineId=${TANGOW_SCREENSHOT_ROUTINE_ID}"
- extendedWaitUntil:
    visible: "Weekly fixture review"
    timeout: 10000
- takeScreenshot: "21-routine"

# A failed run's error sits above the composer, out of the conversation, until dismissed.
- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "tangow:///thread?botId=${TANGOW_SCREENSHOT_FAILED_BOT_ID}&name=Support"
- extendedWaitUntil:
    visible: "Dismiss error"
    timeout: 10000
- assertVisible: "Draft the reply to the refund request."
- takeScreenshot: "21b-thread-run-error"

- runFlow: subflows/restart-app.yaml

# A bot shared with this user: their own thread, the team save under the reply, the MCP card
# pointing to web or desktop, and a title menu without the owner's screens.
- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "tangow:///thread?botId=${TANGOW_SCREENSHOT_SHARED_BOT_ID}&name=Release%20notes"
- extendedWaitUntil:
    visible: "Saved for the team"
    timeout: 10000
- assertVisible: "Add it on web or desktop"
- assertNotVisible: "Open computer"
- takeScreenshot: "31-shared-bot-thread"
- tapOn: "Release notes"
- assertVisible: "Clear conversation"
- assertNotVisible: "Bot settings"
- takeScreenshot: "32-shared-bot-actions"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          point: "50%,92%"
- runFlow:
    when:
      platform: Android
    commands:
      - back

# The shared bot's computer as the member sees it: no mode picker, and no Take control until
# their own run asks for them.
- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "tangow:///computer?botId=${TANGOW_SCREENSHOT_SHARED_BOT_ID}&name=Release%20notes&shared=1"
- extendedWaitUntil:
    visible: "Release notes’s computer"
    timeout: 10000
- assertNotVisible: "Take control"
- assertNotVisible: "Private"
- takeScreenshot: "32b-shared-bot-computer"

# The owner's share sheet for Writer, shared with the teammate, then its team memory.
- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "tangow:///bot-share?botId=${TANGOW_SCREENSHOT_SHARE_BOT_ID}"
- extendedWaitUntil:
    visible: "Skills this bot can use"
    timeout: 10000
- assertVisible: "Grace Hopper"
- assertVisible: "Apps this bot can use"
- assertVisible: "Everyone who uses this bot can see its files and browser sign-ins."
- takeScreenshot: "33-share-sheet"
- tapOn: "Done"

- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "tangow:///bot?botId=${TANGOW_SCREENSHOT_SHARE_BOT_ID}"
- extendedWaitUntil:
    visible: "Knowledge"
    timeout: 10000
- tapOn: "Knowledge"
- extendedWaitUntil:
    visible: "Team memory"
    timeout: 10000
- takeScreenshot: "34-team-memory"

# A group the teammate created with the user: who is in it, read-only, and Leave group.
- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "tangow:///group-settings?groupId=${TANGOW_SCREENSHOT_MEMBER_GROUP_ID}"
- extendedWaitUntil:
    visible: "Leave group"
    timeout: 10000
- assertVisible: "Grace Hopper"
- assertNotVisible: "Delete group"
- takeScreenshot: "35-group-settings-member"

- runFlow: subflows/restart-app.yaml

# Verify saved appearance changes on already-mounted screens and modal routes.
- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "tangow:///profile"
- extendedWaitUntil:
    visible: "Dark"
    timeout: 10000
- tapOn: "Dark"
- takeScreenshot: "22-account-dark"

- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "tangow:///new"
- assertVisible: "Name this bot"
- takeScreenshot: "23-new-bot-dark"

- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "tangow:///new-group"
- assertVisible: "Name this group"
- takeScreenshot: "24-new-group-dark"

- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "tangow:///new-space"
- assertVisible: "Customer support"
- takeScreenshot: "25-new-space-dark"

- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "tangow:///thread?botId=${TANGOW_SCREENSHOT_BOT_ID}&name=Researcher"
- scrollUntilVisible:
    element: "The fixture workspace is ready."
    direction: UP
    timeout: 20000
    centerElement: true
- takeScreenshot: "26-thread-dark"

- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "tangow:///thread?botId=${TANGOW_SCREENSHOT_FAILED_BOT_ID}&name=Support"
- extendedWaitUntil:
    visible: "Dismiss error"
    timeout: 10000
- takeScreenshot: "26b-thread-run-error-dark"
- tapOn: "Dismiss error"
- assertNotVisible: "Dismiss error"

- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "tangow:///group-thread?groupId=${TANGOW_SCREENSHOT_GROUP_ID}&name=Launch%20team"
- extendedWaitUntil:
    visible: "Launch checklist"
    timeout: 10000
- takeScreenshot: "27-group-thread-dark"

- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "tangow:///group-settings?groupId=${TANGOW_SCREENSHOT_GROUP_ID}"
- extendedWaitUntil:
    visible: "Lead bot"
    timeout: 10000
- takeScreenshot: "28-group-settings-dark"

- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "tangow:///bot?botId=${TANGOW_SCREENSHOT_BOT_ID}"
- extendedWaitUntil:
    visible: "Appearance"
    timeout: 10000
- takeScreenshot: "28b-bot-page-dark"

- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "tangow:///"
- extendedWaitUntil:
    visible: "Researcher.*"
    timeout: 10000
- takeScreenshot: "28c-inbox-dark"

- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "tangow:///profile"
- tapOn: "Light"
- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "tangow:///thread?botId=${TANGOW_SCREENSHOT_BOT_ID}&name=Researcher"
- scrollUntilVisible:
    element: "The fixture workspace is ready."
    direction: UP
    timeout: 20000
    centerElement: true
- takeScreenshot: "29-thread-light-restored"

# Capture the reaction after theme comparisons. Reactions are append-only, so adding
# 👍 earlier would leak into dark/light thread frames with no remove control.
- longPressOn: "The fixture workspace is ready."
- tapOn: "👍"
- extendedWaitUntil:
    visible: "👍"
    timeout: 10000
- assertNotVisible: "(.*, )?Reply"
- takeScreenshot: "15c-message-reaction"

# The update's progress shows over the app's root, under any open sheet; start from the root.
- runFlow: subflows/restart-app.yaml
# The fixture booted this computer, so its update runs through the real fixture API.
- runFlow:
    file: subflows/open-link.yaml
    env:
      LINK: "tangow:///computer-settings"
- extendedWaitUntil:
    visible: "Update computer"
    timeout: 10000
- tapOn: "Update computer"
- extendedWaitUntil:
    visible: "Computer updated"
    timeout: 30000
- assertVisible: "Done"
- takeScreenshot: "30-computer-updated"
- tapOn: "Done"
- assertNotVisible: "Computer updated"
